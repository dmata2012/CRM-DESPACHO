<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convertidor de Audio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <header>
      <h1>Convertidor <span>YouTube → Audio</span></h1>
      <p class="subtitle">Busca un video, elige formato y calidad, y agrégalo a la cola.</p>
    </header>

    <form id="search-form" class="search">
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="off">
      <button type="submit" id="search-btn">Buscar</button>
    </form>

    <p id="message" class="message" hidden></p>

    <section id="result" class="card" hidden>
      <img id="thumb" alt="Miniatura del video">
      <div class="details">
        <h2 id="title"></h2>
        <p id="meta" class="meta"></p>

        <div class="options">
          <label>Formato <select id="format"></select></label>
          <label id="bitrate-label">Calidad <select id="bitrate"></select></label>
          <button id="add-btn" type="button">Agregar a la cola</button>
        </div>
      </div>
    </section>

    <section id="queue-section" class="queue" hidden>
      <div class="queue-header">
        <h2>Cola de descargas <span id="queue-count"></span></h2>
        <label class="check"><input id="auto-download" type="checkbox" checked> Descargar al terminar</label>
        <button id="clear-btn" type="button" class="secondary">Quitar terminados</button>
      </div>
      <ul id="queue"></ul>
    </section>

    <footer>
      Descarga solo contenido propio, con licencia libre o sobre el que tengas derechos.
    </footer>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
